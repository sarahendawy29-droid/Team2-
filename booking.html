<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Trip</title>
    <link rel="stylesheet" href="booking.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
           <img src="img/Gemini_Generated_Image_nq78jknq78jknq78.jfif">
            <span>Sfarny</span>
        </div>
        <nav class="nav">
             <a href="index.html">Home</a>
        <a href="">Destination</a>
         <a href="">Tours</a>
        <a href="">About</a>
        <a href="">Contact</a> 
        </nav>
        <a href="booking.html"><button class="book-btn">Book Now</button></a>
    </header>
    <section class="hero-section">
        <div class="hero-content">
           <h1>Book Your Trip</h1>
           <p>Fill in the form below to book your dream trip.</p>
        </div>
    </section>
    <section class="book">
        <form class="book-container">
          <div class="book-form">
            
            <div class="form">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="form">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="form">
                <label>Phone</label>
                <input type="number" placeholder="Enter your phone number" required>
            </div>
            <div class="form">
                <label>Destination</label>
                <select required>
                 <option value=""disabled selected>Select destination</option>
                 <option value="paris">Paris,France</option>
                 <option value="bali">Bali,Indonesia</option>
                 <option value="maldives">Maldives</option>
                 <option value="tokyo">Tokyo,Japan</option>
                 <option value="roma">Roma,Italy</option>
                 <option value="barcelona">Barcelona,Spain</option>
                 <option value="istanbul">Istanbul,Turkey</option>
                 <option value="sharm">Sharm El-Sheikh,Egypt</option>
                </select>
            </div>
            <div class="form">
                <label>Tour Package</label>
                <select required>
                    <option value="">Select tour package</option>
                    <option value="basic">Basic Explorer</option>
                    <option value="family">Family Adventure</option>
                    <option value="luxury">Luxury VIP</option>
                </select>
            </div>
            <div class="form">
                <label>Number of Travelers</label>
                <input type="number" placeholder="Enter the number of travelers" required>
            </div>
            <div class="form">
                <label>Travel Date</label>
                <input type="date" placeholder="mm/dd/yyyy" required>
            </div>
            <div class="form">
                <label>Return Date</label>
                <input type="date" placeholder="mm/dd/yyyy" required>
            </div>
            <div class="form">
                <label>Room Type</label>
            <div class="form-radio">
                 <label class="radio">
                  <input type="radio" name="room" value="standard">Standard
                 </label>
                 <label class="radio">
                  <input type="radio" name="room" value="deluxe" >Deluxe
                 </label>
                 <label  class="radio">
                <input type="radio" name="room" value="suite">Suite
                </label>
            </div>
            </div>
            <div class="form">
                <label>Payment Method</label>
                <select required>
                 <option value="" disabled selected>Select payment method</option>
                 <option value="credit">Credit Card</option>
                 <option value="paypal">PayPal</option>
                 <option value="bank">Bank</option>
                </select>
            </div>
            <div class="form full-width">
                <label>Special Requests</label>
                <textarea name="message" id="requests" rows="4" placeholder="Any special requests?"></textarea>
            </div>

                <button type="submit" class="submit-btn">Book Trip Now</button>

          </div>   
        </form>
    </section>
    <footer>
    <div class="logo">
           <img src="img/Gemini_Generated_Image_nq78jknq78jknq78.jfif">
            <span>Sfarny</span>
        </div>
    <div class="footer-links">
      <a href="#">Home</a>
      <a href="#">Destinations</a>
      <a href="#">Tours</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
    <div class="social-icons">
      <i class="fa-brands fa-facebook"></i>
      <i class="fa-brands fa-twitter"></i>
      <i class="fa-brands fa-instagram"></i>
      <i class="fa-brands fa-youtube"></i>
    </div>
    <div class="foo">
         <p>© 2026 Safarny — All Rights Reserved.</p>
    </div>
  </footer>
</body>
</html>
